[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-usage-ranker"
version = "0.1.0"
description = "Rank Claude Code skills across an organization from OpenTelemetry telemetry"
requires-python = ">=3.12"
dependencies = ["typer>=0.12", "rich>=13", "pyyaml>=6", "jinja2>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
skill-ranker = "skill_ranker.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skill_ranker = ["adapters/sql/*.sql", "report/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
